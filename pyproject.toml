[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "sitelabs-graph-security"
version = "0.1.0"
description = "Security for the sitelabs graph servers: API keys, roles and permissions, the admin login, browser sessions, OAuth 2.0 / OpenID Connect access tokens, rate limits and internal TLS"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE.txt", "NOTICES.txt"]
authors = [{ name = "Sitelabs.com" }]
requires-python = ">=3.12"
dependencies = [
    "PyJWT[crypto]>=2.10",  # access tokens from an identity provider (graph_security.oidc)
]

[project.optional-dependencies]
httpx = ["httpx>=0.28"]     # internal_tls.httpx_client()
test = ["pytest>=9.1", "httpx>=0.28"]

[tool.setuptools.packages.find]
where = ["src"]

[tool.pytest.ini_options]
testpaths = ["tests"]
